<!DOCTYPE html>
<html lang="en"
      th:replace="~{admin/layout/main-layout :: layout(pageTitleKey='admin.projects.title', content=~{::body}, activePage='projects')}"
      xmlns:th="http://www.thymeleaf.org">
<body>
<div class="flex justify-between items-center mb-4">
    <h1 class="text-2xl font-semibold text-gray-800" th:text="#{admin.projects.title}">Project List</h1>
    <a class="px-4 py-2 bg-indigo-600 text-white rounded-md hover:bg-indigo-700" th:href="@{/admin/projects/new}"
       th:text="#{admin.projects.button.new}">Create New Project</a>
</div>

<div class="bg-white shadow-md rounded-lg overflow-hidden">
    <table class="min-w-full divide-y divide-gray-200">
        <thead class="bg-gray-50">
        <tr>
            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase"
                th:text="#{admin.projects.table.name}">Name
            </th>
            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase"
                th:text="#{admin.projects.table.team}">Team
            </th>
            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase"
                th:text="#{admin.projects.table.leader}">PM
            </th>
            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase"
                th:text="#{admin.projects.table.dates}">Duration
            </th>
            <th class="px-6 py-3 text-right text-xs font-medium text-gray-500 uppercase"
                th:text="#{admin.projects.table.actions}">Actions
            </th>
        </tr>
        </thead>
        <tbody class="bg-white divide-y divide-gray-200">
        <tr th:each="p : ${projectPage.content}">
            <td class="px-6 py-4">
                <a class="text-indigo-600 hover:underline font-medium" th:href="@{/admin/projects/{id}(id=${p.id})}"
                   th:text="${p.name}">Project X</a>
                <p class="text-gray-500 text-xs" th:text="${p.abbreviation}">PRJ</p>
            </td>
            <td class="px-6 py-4 text-sm text-gray-900" th:text="${p.team.name}">Team A</td>
            <td class="px-6 py-4 text-sm text-gray-500" th:text="${p.leader?.fullName}">Manager</td>
            <td class="px-6 py-4 text-sm text-gray-500">
                <span th:text="${p.startDate}"></span> - <span th:text="${p.endDate}"></span>
            </td>
            <td class="px-6 py-4 whitespace-nowrap text-right text-sm font-medium">
                <a class="text-indigo-600 hover:text-indigo-900 mr-4" th:href="@{/admin/projects/edit/{id}(id=${p.id})}"
                   th:text="#{admin.projects.action.edit}">Edit</a>

                <form class="inline" method="POST" onsubmit="return confirm(this.getAttribute('data-confirm-message'));"
                      th:action="@{/admin/projects/delete/{id}(id=${p.id})}"
                      th:data-confirm-message="#{admin.projects.delete.confirm}">
                    <button class="text-red-600 hover:text-red-900" th:text="#{admin.projects.action.delete}"
                            type="submit">Delete
                    </button>
                </form>
            </td>
        </tr>
        <tr th:if="${projectPage.empty}">
            <td class="px-6 py-4 text-center text-gray-500" colspan="5" th:text="#{admin.projects.table.empty}">No
                projects found.
            </td>
        </tr>
        </tbody>
    </table>

    <div class="px-6 py-4 border-t" th:if="${projectPage.totalPages > 1}">
        <nav class="flex justify-between items-center">
                <span class="text-sm text-gray-700"
                      th:utext="#{admin.projects.pagination.info(${projectPage.number + 1}, ${projectPage.totalPages}, ${projectPage.totalElements})}">
                </span>
            <div>
                <a class="px-3 py-1 border rounded-md hover:bg-gray-100" th:href="@{/admin/projects(page=1)}"
                   th:text="#{admin.projects.pagination.first}" th:unless="${projectPage.first}">First</a>
                <a class="px-3 py-1 border rounded-md hover:bg-gray-100"
                   th:href="@{/admin/projects(page=${projectPage.number})}"
                   th:if="${projectPage.hasPrevious()}"
                   th:text="#{admin.projects.pagination.previous}">Prev</a>
                <a class="px-3 py-1 border rounded-md hover:bg-gray-100"
                   th:href="@{/admin/projects(page=${projectPage.number + 2})}"
                   th:if="${projectPage.hasNext()}" th:text="#{admin.projects.pagination.next}">Next</a>
                <a class="px-3 py-1 border rounded-md hover:bg-gray-100"
                   th:href="@{/admin/projects(page=${projectPage.totalPages})}"
                   th:text="#{admin.projects.pagination.last}" th:unless="${projectPage.last}">Last</a>
            </div>
        </nav>
    </div>
</div>
</body>
</html>
