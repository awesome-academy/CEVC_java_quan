<!DOCTYPE html>
<html lang="en"
      th:replace="~{admin/layout/main-layout :: layout(pageTitleKey='admin.projects.detail.title', content=~{::body}, activePage='projects')}"
      xmlns:th="http://www.thymeleaf.org">
<body>
<!-- Info -->
<div class="bg-white shadow rounded-lg p-6 mb-6">
    <h1 class="text-3xl font-bold text-gray-900" th:text="${project.name}">Project Name</h1>
    <p class="text-sm text-gray-500" th:text="${project.abbreviation}"></p>
    <div class="mt-4 grid grid-cols-2 gap-4 text-sm">
        <div><strong th:text="#{admin.projects.table.team}">Team:</strong> <span th:text="${project.team.name}"></span>
        </div>
        <div><strong th:text="#{admin.projects.table.leader}">PM:</strong> <span
                th:text="${project.leader?.fullName}"></span></div>
        <div><strong th:text="#{admin.projects.table.dates}">Dates:</strong> <span
                th:text="${project.startDate}"></span> - <span th:text="${project.endDate}"></span></div>
    </div>
</div>

<!-- Members -->
<div class="bg-white shadow rounded-lg overflow-hidden">
    <div class="px-6 py-4 border-b border-gray-200 flex justify-between items-center">
        <h3 class="text-lg font-medium text-gray-900" th:text="#{admin.projects.members.title}">Members</h3>

        <!-- Add Member Form -->
        <form class="flex gap-2 flex-col" method="POST"
              th:action="@{/admin/projects/{id}/members/add(id=${project.id})}" th:object="${memberAssignmentDTO}">
            <div>
                <select class="text-sm border-gray-300 rounded-md" required th:field="*{memberId}">
                    <option th:text="#{admin.projects.members.option.select_member}" value="">Select Member</option>
                    <option th:each="m : ${members}" th:text="${m.fullName}" th:value="${m.id}"></option>
                </select>
                <div class="text-red-600 text-xs mt-1" th:errors="*{memberId}"
                     th:if="${#fields.hasErrors('memberId')}"></div>
            </div>
            <div>
                <select class="text-sm border-gray-300 rounded-md" required th:field="*{projectRoleId}">
                    <option th:each="r : ${projectRoles}" th:text="${r.name}" th:value="${r.id}"></option>
                </select>
                <div class="text-red-600 text-xs mt-1" th:errors="*{projectRoleId}"
                     th:if="${#fields.hasErrors('projectRoleId')}"></div>
            </div>
            <button class="px-3 py-1 bg-green-600 text-white text-sm rounded hover:bg-green-700"
                    th:text="#{admin.projects.members.button.add}"
                    type="submit">Add
            </button>
            <div class="text-red-600 text-xs mt-2" th:errors="*{}" th:if="${#fields.hasGlobalErrors()}"></div>
        </form>
    </div>

    <table class="min-w-full divide-y divide-gray-200">
        <thead class="bg-gray-50">
        <tr>
            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase"
                th:text="#{admin.projects.members.table.name}">Name
            </th>
            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase"
                th:text="#{admin.projects.members.table.email}">Email
            </th>
            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase"
                th:text="#{admin.projects.members.table.role}">Role
            </th>
            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase"
                th:text="#{admin.projects.members.table.joined}">Joined
            </th>
            <th class="px-6 py-3 text-right text-xs font-medium text-gray-500 uppercase"
                th:text="#{admin.projects.members.table.actions}">Action
            </th>
        </tr>
        </thead>
        <tbody class="bg-white divide-y divide-gray-200">
        <tr th:each="pm : ${project.projectMembers}" th:if="${pm.unassignedAt == null}">
            <td class="px-6 py-4 text-sm font-medium text-gray-900" th:text="${pm.member.fullName}">Name</td>
            <td class="px-6 py-4 text-sm text-gray-500" th:text="${pm.member.email}">Email</td>
            <td class="px-6 py-4 text-sm text-gray-500" th:text="${pm.projectRole.name}">Dev</td>
            <td class="px-6 py-4 text-sm text-gray-500" th:text="${pm.assignedAt}">2023-01-01</td>
            <td class="px-6 py-4 text-right text-sm font-medium">
                <form class="inline" method="POST" onsubmit="return confirm(this.getAttribute('data-confirm-message'));"
                      th:action="@{/admin/projects/{id}/members/remove(id=${project.id})}"
                      th:data-confirm-message="#{admin.projects.members.remove.confirm}">
                    <input name="memberId" th:value="${pm.member.id}" type="hidden">
                    <button class="text-red-600 hover:text-red-900" th:text="#{admin.projects.members.action.remove}"
                            type="submit">Remove
                    </button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
