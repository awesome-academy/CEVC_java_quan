<!DOCTYPE html>
<html lang="en"
      th:replace="~{admin/layout/main-layout :: layout(pageTitleKey=${skillDTO.id == null} ? 'admin.skills.form.title.create' : 'admin.skills.form.title.edit', content=~{::body}, activePage='skills')}"
      xmlns:th="http://www.thymeleaf.org">
<body>
<h1 class="text-2xl font-semibold text-gray-800"
    th:text="${skillDTO.id == null} ? #{admin.skills.form.title.create} : #{admin.skills.form.title.edit}">
    Skill Form
</h1>
<hr class="my-4"/>

<div class="bg-white shadow-md rounded-lg p-6 max-w-lg">
    <form method="POST"
          th:action="${skillDTO.id == null} ? @{/admin/skills/save} : @{/admin/skills/update/{id}(id=${skillDTO.id})}"
          th:object="${skillDTO}">

        <input th:field="*{id}" th:if="${skillDTO.id != null}" type="hidden"/>

        <div class="mb-4">
            <label class="block text-sm font-medium text-gray-700" for="name" th:text="#{admin.skills.form.label.name}">Skill
                Name (*)</label>
            <input class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500"
                   id="name" th:classappend="${#fields.hasErrors('name')} ? 'border-red-500' : ''"
                   th:field="*{name}"
                   type="text"/>
            <p class="mt-1 text-sm text-red-600" th:errors="*{name}" th:if="${#fields.hasErrors('name')}"></p>
        </div>

        <div class="mb-4">
            <label class="block text-sm font-medium text-gray-700" for="level"
                   th:text="#{admin.skills.form.label.level}">Default Level</label>
            <input class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500"
                   id="level" th:classappend="${#fields.hasErrors('level')} ? 'border-red-500' : ''"
                   th:field="*{level}"
                   type="text"/>
            <p class="mt-1 text-sm text-red-600" th:errors="*{level}" th:if="${#fields.hasErrors('level')}"></p>
        </div>

        <div class="mb-4">
            <label class="block text-sm font-medium text-gray-700" for="usedYears"
                   th:text="#{admin.skills.form.label.years}">Default Years</label>
            <input class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500"
                   id="usedYears" th:classappend="${#fields.hasErrors('usedYears')} ? 'border-red-500' : ''"
                   th:field="*{usedYears}"
                   type="number"/>
            <p class="mt-1 text-sm text-red-600" th:errors="*{usedYears}" th:if="${#fields.hasErrors('usedYears')}"></p>
        </div>

        <div class="mt-6 flex items-center justify-end gap-x-4">
            <a class="text-sm font-medium text-gray-600 hover:text-gray-800" th:href="@{/admin/skills}"
               th:text="#{admin.skills.form.button.cancel}">
                Cancel
            </a>
            <button class="px-4 py-2 bg-indigo-600 text-white rounded-md hover:bg-indigo-700"
                    th:text="#{admin.skills.form.button.save}"
                    type="submit">
                Save Changes
            </button>
        </div>
    </form>
</div>
</body>
</html>
