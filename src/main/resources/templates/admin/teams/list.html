<!DOCTYPE html>
<html lang="en"
      th:replace="~{admin/layout/main-layout :: layout(pageTitleKey='admin.teams.title', content=~{::body}, activePage='teams')}"
      xmlns:th="http://www.thymeleaf.org">
<body>
<div class="flex justify-between items-center mb-4">
    <h1 class="text-2xl font-semibold text-gray-800" th:text="#{admin.teams.title}">Team List</h1>
    <a class="px-4 py-2 bg-indigo-600 text-white rounded-md hover:bg-indigo-700" th:href="@{/admin/teams/new}"
       th:text="#{admin.teams.button.new}">Create New Team</a>
</div>

<div class="bg-white shadow-md rounded-lg overflow-hidden">
    <table class="min-w-full divide-y divide-gray-200">
        <thead class="bg-gray-50">
        <tr>
            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase"
                th:text="#{admin.teams.table.name}">Name
            </th>
            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase"
                th:text="#{admin.teams.table.leader}">Leader
            </th>
            <th class="px-6 py-3 text-right text-xs font-medium text-gray-500 uppercase"
                th:text="#{admin.teams.table.actions}">Actions
            </th>
        </tr>
        </thead>
        <tbody class="bg-white divide-y divide-gray-200">
        <tr th:each="team : ${teamPage.content}">
            <td class="px-6 py-4">
                <a class="text-indigo-600 hover:underline font-medium" th:href="@{/admin/teams/{id}(id=${team.id})}"
                   th:text="${team.name}">Team A</a>
                <p class="text-gray-500 text-xs" th:text="${team.description}">Desc</p>
            </td>
            <td class="px-6 py-4 text-sm text-gray-900" th:text="${team.leader.fullName}">Leader Name</td>
            <td class="px-6 py-4 whitespace-nowrap text-right text-sm font-medium">
                <a class="text-indigo-600 hover:text-indigo-900 mr-4" th:href="@{/admin/teams/edit/{id}(id=${team.id})}"
                   th:text="#{admin.teams.action.edit}">Edit</a>

                <form class="inline" method="POST" onsubmit="return confirm(this.getAttribute('data-confirm-message'));"
                      th:action="@{/admin/teams/delete/{id}(id=${team.id})}"
                      th:data-confirm-message="#{admin.teams.delete.confirm}">
                    <button class="text-red-600 hover:text-red-900" th:text="#{admin.teams.action.delete}"
                            type="submit">Delete
                    </button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>

    <!-- Pagination -->
    <div class="px-6 py-4 border-t" th:if="${teamPage.totalPages > 1}">
        <nav class="flex justify-between items-center">
                <span class="text-sm text-gray-700"
                      th:utext="#{admin.teams.pagination.info(${teamPage.number + 1}, ${teamPage.totalPages}, ${teamPage.totalElements})}">
                </span>
            <div>
                <a class="px-3 py-1 border rounded-md hover:bg-gray-100" th:href="@{/admin/teams(page=1)}"
                   th:text="#{admin.teams.pagination.first}"
                   th:unless="${teamPage.first}">First</a>
                <a class="px-3 py-1 border rounded-md hover:bg-gray-100"
                   th:href="@{/admin/teams(page=${teamPage.number})}"
                   th:if="${teamPage.hasPrevious()}" th:text="#{admin.teams.pagination.previous}">Prev</a>
                <a class="px-3 py-1 border rounded-md hover:bg-gray-100"
                   th:href="@{/admin/teams(page=${teamPage.number + 2})}"
                   th:if="${teamPage.hasNext()}"
                   th:text="#{admin.teams.pagination.next}">Next</a>
                <a class="px-3 py-1 border rounded-md hover:bg-gray-100"
                   th:href="@{/admin/teams(page=${teamPage.totalPages})}"
                   th:text="#{admin.teams.pagination.last}"
                   th:unless="${teamPage.last}">Last</a>
            </div>
        </nav>
    </div>
</div>
</body>
</html>
